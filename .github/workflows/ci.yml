name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The Gradle wrapper is checked in, so CI builds with exactly the same Gradle
# version as Android Studio does locally – no separate pin to keep in sync.
jobs:
  engine-tests:
    name: Engine tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run engine unit tests
        run: ./gradlew :engine:test --no-daemon --stacktrace

  app-build:
    name: App build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
